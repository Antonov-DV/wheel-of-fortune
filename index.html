<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо фортуны</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at 50% 20%, #2c3e50, #0f1420 70%);
  color: #fff;
}

.wrap { text-align: center; padding: 20px; }

h1 { margin: 0 0 16px; font-weight: 700; }

#players { max-width: 620px; margin: 0 auto 18px; }

#chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 14px;
  min-height: 36px;
}

#chips .empty { color: rgba(255,255,255,.45); font-size: 14px; align-self: center; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.12);
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}

.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.chip-x {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 12px; line-height: 1;
  cursor: pointer; padding: 0;
  transition: background .15s;
}
.chip-x:hover { background: #e74c3c; }

#excluded {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 14px;
}
#excluded:empty { display: none; }

#excluded .ex-label {
  color: rgba(255,255,255,.4);
  font-size: 13px;
  align-self: center;
}

.chip.ex {
  background: transparent;
  border-style: dashed;
  border-color: rgba(255,255,255,.2);
  color: rgba(255,255,255,.5);
}
.chip.ex .dot { opacity: .45; }

.chip-restore {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%;
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 13px; line-height: 1;
  cursor: pointer; padding: 0;
  transition: background .15s;
}
.chip-restore:hover { background: #2ecc71; }

#players.locked .chip-x,
#players.locked .chip-restore { pointer-events: none; opacity: .35; }

#add-form { display: flex; gap: 8px; justify-content: center; }

#new-name {
  flex: 0 1 300px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 10px;
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 14px;
  text-align: center;
  outline: none;
}
#new-name:focus { border-color: #f1c40f; }
#new-name::placeholder { color: rgba(255,255,255,.4); }

#add-btn {
  padding: 10px 18px;
  border: none; border-radius: 10px;
  background: rgba(255,255,255,.14);
  color: #fff; font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
#add-btn:hover:not(:disabled) { background: rgba(255,255,255,.26); }
#new-name:disabled, #add-btn:disabled { opacity: .5; }

#reset-btn {
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 10px;
  background: transparent;
  color: rgba(255,255,255,.75);
  font-size: 14px;
  cursor: pointer;
}
#reset-btn:hover { border-color: #e74c3c; color: #fff; }
#players.locked #reset-btn { pointer-events: none; opacity: .35; }

.wheel-box { position: relative; display: inline-block; }

.pointer {
  position: absolute;
  top: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 30px solid #f1c40f;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.5));
  z-index: 2;
}

canvas {
  display: block;
  border-radius: 50%;
  max-width: 100%;
  height: auto;
  box-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 18px 45px rgba(0,0,0,.55);
}

#spin {
  margin-top: 24px;
  padding: 14px 48px;
  font-size: 18px;
  font-weight: 700;
  color: #1b1b1b;
  background: linear-gradient(180deg, #f7d154, #f1a90c);
  border: none;
  border-radius: 999px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 6px 18px rgba(241,201,15,.35);
}
#spin:hover:not(:disabled) { transform: translateY(-2px); }
#spin:disabled { opacity: .55; cursor: wait; }

#result {
  min-height: 34px;
  margin-top: 16px;
  font-size: 22px;
  font-weight: 700;
  color: #f1c40f;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎡 Колесо фортуны</h1>

  <div id="players">
    <div id="chips"></div>
    <div id="excluded"></div>
    <form id="add-form" autocomplete="off">
      <input id="new-name" placeholder="Имя нового игрока" maxlength="30">
      <button type="submit" id="add-btn">Добавить</button>
      <button type="button" id="reset-btn" hidden>Вернуть всех</button>
    </form>
  </div>

  <div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="500" height="500"></canvas>
  </div>
  <button id="spin">Крутить!</button>
  <div id="result"></div>
</div>

<script>
const canvas    = document.getElementById('wheel');
const ctx       = canvas.getContext('2d');
const resultEl  = document.getElementById('result');
const spinBtn   = document.getElementById('spin');
const playersEl = document.getElementById('players');
const chipsEl   = document.getElementById('chips');
const excludedEl = document.getElementById('excluded');
const addForm   = document.getElementById('add-form');
const newNameIn = document.getElementById('new-name');
const addBtn    = document.getElementById('add-btn');
const resetBtn  = document.getElementById('reset-btn');

const PALETTE = [
  '#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db',
  '#9b59b6', '#0abde3', '#00b894', '#6c5ce7', '#e58e26', '#d63031'
];

const TAU = Math.PI * 2;

const DEFAULT_NAMES = [
  'Ольга Козлова',
  'Дмитрий Антонов',
  'Дмитрий Калинин',
  'Арсений Коротков',
  'Дмитрий Максимов',
  'Максим Бирюков',
  'Инна Грекова',
  'Михаил Васильев',
  'Константин Мариненков',
  'Тимур Мустафин'
];

// localStorage: кто исключён крестиком и кого добавили вручную
const LS_KEY = 'wheel-of-fortune:v1';

function loadState() {
  let excluded = [], extra = [];
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (Array.isArray(saved.excluded)) excluded = saved.excluded;
    if (Array.isArray(saved.extra)) extra = saved.extra;
  } catch (e) { /* повреждённые данные — стартуем с полным списком */ }
  return { excluded: new Set(excluded), extra };
}

const state = loadState();

const currentNames = () => [
  ...DEFAULT_NAMES.filter(n => !state.excluded.has(n)),
  ...state.extra
];

const save = () =>
  localStorage.setItem(LS_KEY, JSON.stringify({
    excluded: [...state.excluded],
    extra: state.extra
  }));

let names = currentNames();

let rotation = 0;    // текущий угол поворота колеса
let spinning = false;
let winner   = null; // индекс подсвеченного сектора

function draw(list) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const R  = cx - 8;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!list.length) return;

  const seg = TAU / list.length;
  const fontSize = list.length > 8 ? 14 : 17;

  list.forEach((label, i) => {
    const a0 = rotation + i * seg;
    const highlighted = i === winner;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, a0, a0 + seg);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.lineWidth = highlighted ? 6 : 2;
    ctx.strokeStyle = highlighted ? '#fff' : 'rgba(255,255,255,.7)';
    ctx.stroke();

    // подпись вдоль радиуса сектора
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a0 + seg / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = '#fff';
    const text = label.length > 20 ? label.slice(0, 19) + '…' : label;
    ctx.fillText(text, R - 16, 0);
    ctx.restore();
  });

  // ступица в центре
  ctx.beginPath();
  ctx.arc(cx, cy, 34, 0, TAU);
  ctx.fillStyle = '#1b2735';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#f1c40f';
  ctx.stroke();
}

function renderChips() {
  chipsEl.innerHTML = '';

  if (!names.length) {
    const empty = document.createElement('span');
    empty.className = 'empty';
    empty.textContent = 'Список пуст — добавьте игроков';
    chipsEl.appendChild(empty);
    return;
  }

  names.forEach((name, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = PALETTE[i % PALETTE.length];

    const label = document.createElement('span');
    label.textContent = name;

    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'chip-x';
    x.textContent = '✕';
    x.title = 'Убрать ' + name;
    x.addEventListener('click', () => {
      if (spinning) return;
      const name = names.splice(i, 1)[0];
      if (DEFAULT_NAMES.includes(name)) state.excluded.add(name);
      else state.extra = state.extra.filter(n => n !== name);
      save();
      winner = null;
      resultEl.textContent = '';
      renderChips();
      draw(names);
    });

    chip.append(dot, label, x);
    chipsEl.appendChild(chip);
  });

  resetBtn.hidden = !state.excluded.size && !state.extra.length;
  renderExcluded();
}

// исключённые показываются отдельным блоком — вернуть можно в один клик
function renderExcluded() {
  excludedEl.innerHTML = '';
  const excluded = DEFAULT_NAMES.filter(n => state.excluded.has(n));
  if (!excluded.length) return;

  const caption = document.createElement('span');
  caption.className = 'ex-label';
  caption.textContent = 'Не играют:';
  excludedEl.appendChild(caption);

  excluded.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'chip ex';

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = PALETTE[DEFAULT_NAMES.indexOf(name) % PALETTE.length];

    const labelEl = document.createElement('span');
    labelEl.textContent = name;

    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'chip-restore';
    back.textContent = '↩';
    back.title = 'Вернуть ' + name;
    back.addEventListener('click', () => {
      if (spinning) return;
      state.excluded.delete(name);
      save();
      names = currentNames();
      winner = null;
      resultEl.textContent = '';
      renderChips();
      draw(names);
    });

    chip.append(dot, labelEl, back);
    excludedEl.appendChild(chip);
  });
}

addForm.addEventListener('submit', e => {
  e.preventDefault();
  if (spinning) return;
  const name = newNameIn.value.trim();
  if (!name) return;

  names.push(name);
  state.extra.push(name);
  save();
  newNameIn.value = '';
  newNameIn.focus();
  winner = null;
  resultEl.textContent = '';
  renderChips();
  draw(names);
});

// вернуть полный состав: снять исключения и убрать гостей
resetBtn.addEventListener('click', () => {
  if (spinning) return;
  state.excluded.clear();
  state.extra = [];
  save();
  names = currentNames();
  winner = null;
  resultEl.textContent = '';
  renderChips();
  draw(names);
});

function finish(list) {
  const seg = TAU / list.length;
  // стрелка сверху = угол -90°; ищем сектор, попавший под неё
  let local = (-Math.PI / 2 - rotation) % TAU;
  if (local < 0) local += TAU;
  winner = Math.floor(local / seg) % list.length;

  draw(list);
  resultEl.textContent = '🎉 Победитель: ' + list[winner];
  spinning = false;
  spinBtn.disabled = false;
  playersEl.classList.remove('locked');
  newNameIn.disabled = false;
  addBtn.disabled = false;
}

spinBtn.addEventListener('click', () => {
  if (spinning) return;
  const list = [...names];
  if (list.length < 2) {
    resultEl.textContent = 'Нужно хотя бы двух игроков';
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  playersEl.classList.add('locked');
  newNameIn.disabled = true;
  addBtn.disabled = true;
  winner = null;
  resultEl.textContent = '';

  const from     = rotation;
  const target   = rotation + TAU * (5 + Math.random() * 2) + Math.random() * TAU;
  const duration = 4200 + Math.random() * 800;
  const start    = performance.now();

  function frame(now) {
    const t    = Math.min(1, (now - start) / duration);
    const ease = 1 - Math.pow(1 - t, 4); // easeOutQuart — быстрый разгон, мягкое торможение
    rotation   = from + (target - from) * ease;
    draw(list);
    if (t < 1) requestAnimationFrame(frame);
    else finish(list);
  }
  requestAnimationFrame(frame);
});

renderChips();
draw(names);
</script>
</body>
</html>
